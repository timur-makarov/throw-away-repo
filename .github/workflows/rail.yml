# Rail's check: repeats the ship checks on every pull request (rail docs github).
# Make `rail` a required check on the base branch. CI runs no model, so it needs no secrets.
name: rail
on:
  pull_request:
permissions:
  contents: read
jobs:
  rail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: rail ci
        run: .rail/bin/rail ci
        env:
          RAIL_BRANCH: ${{ github.head_ref }}
